<script>
/* Show failures on screen instead of a blank page. */
function bootFail(label, detail){
  var el = document.getElementById('boot');
  if (!el) return;
  el.innerHTML = '<b>' + label + '</b><code>' + String(detail).slice(0,600) + '</code>';
}
window.addEventListener('error', function(e){
  bootFail('Startup error', (e.message||'') + (e.filename ? ' — ' + e.filename : ''));
});
window.addEventListener('unhandledrejection', function(e){
  bootFail('Startup error', e.reason && e.reason.message ? e.reason.message : e.reason);
});
</script>

`;

/* ---------------- constants ---------------- */
const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const PALETTE = ["#D9A441","#5FCFA0","#7FB2E5","#C98BD1","#E0796B","#8FD05F","#E5C15F","#5FC7CF","#B79BE8","#E58FA8"];
const SECTORS = ["Diversified fund","Technology","Healthcare","Financials","Consumer staples","Consumer discretionary","Energy","Utilities","Real estate","Industrials","Communication","Materials","Bonds / cash","Other"];
const FREQ = { M:{n:12,l:"Monthly"}, Q:{n:4,l:"Quarterly"}, S:{n:2,l:"Semi-annual"}, A:{n:1,l:"Annual"}, N:{n:0,l:"No dividend"} };

const DEMO = [
  ["SCHD","Schwab US Dividend Equity ETF",250,68,27.5,1.05,"Q","Diversified fund",2],
  ["JEPI","JPMorgan Equity Premium Income",150,54,57,3.6,"M","Diversified fund",0],
  ["O","Realty Income",100,62,57,3.22,"M","Real estate",0],
  ["KO","Coca-Cola",120,52,70,2.04,"Q","Consumer staples",3],
  ["JNJ","Johnson & Johnson",60,140,155,4.96,"Q","Healthcare",2],
  ["MSFT","Microsoft",40,240,420,3.32,"Q","Technology",2],
  ["XOM","Exxon Mobil",80,88,115,3.96,"Q","Energy",2],
  ["MO","Altria",100,46,55,4.08,"Q","Consumer staples",0],
  ["VZ","Verizon",150,48,42,2.71,"Q","Communication",1],
  ["ABBV","AbbVie",30,142,185,6.56,"Q","Healthcare",1],
].map((r,i)=>({id:"d"+i,ticker:r[0],name:r[1],shares:r[2],cost:r[3],price:r[4],div:r[5],freq:r[6],sector:r[7],anchor:r[8],day:15}));

/* ---------------- helpers ---------------- */
const usd = (n,d=0)=> (n<0?"-":"")+"$"+Math.abs(n||0).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = (n,d=1)=> (n*100).toFixed(d)+"%";
const num = (v,f=0)=>{const n=parseFloat(v);return isNaN(n)?f:n;};

function payMonths(h){
  const f = FREQ[h.freq]; if(!f || f.n===0) return [];
  const step = 12/f.n, a = (h.anchor||0)%step;
  return Array.from({length:f.n},(_,i)=>(a+i*step)%12).sort((x,y)=>x-y);
}
const value = h => h.shares*h.price;
const annualIncome = h => (FREQ[h.freq]?.n ? h.shares*h.div : 0);
const perPay = h => (FREQ[h.freq]?.n ? h.shares*h.div/FREQ[h.freq].n : 0);

function monthlyMatrix(hs){
  const rows = hs.map((h,i)=>({h,color:PALETTE[i%PALETTE.length],months:Array(12).fill(0)}));
  rows.forEach(r=>payMonths(r.h).forEach(m=>{r.months[m]=perPay(r.h);}));
  const totals = Array(12).fill(0);
  rows.forEach(r=>r.months.forEach((v,m)=>totals[m]+=v));
  return {rows,totals};
}

/* ---------------- risk engine ---------------- */
function analyze(hs){
  const total = hs.reduce((s,h)=>s+value(h),0);
  const inc = hs.reduce((s,h)=>s+annualIncome(h),0);
  if(!total) return null;
  const flags=[], moves=[];
  let score=100;

  const w = hs.map(h=>({h,w:value(h)/total})).sort((a,b)=>b.w-a.w);
  const top=w[0], top5=w.slice(0,5).reduce((s,x)=>s+x.w,0);
  const hhi = w.reduce((s,x)=>s+x.w*x.w,0);

  if(top.w>0.25){score-=22;flags.push(["high","Single position dominates",`${top.h.ticker} is ${pct(top.w)} of the portfolio. A bad quarter there moves your whole balance.`]);moves.push(`Cap any one position near 10–15%. Trimming ${top.h.ticker} to 15% frees ${usd(total*(top.w-0.15))} to redeploy.`);}
  else if(top.w>0.15){score-=10;flags.push(["med","Largest position is oversized",`${top.h.ticker} carries ${pct(top.w)} of the balance — above the 10–15% band many long-term holders use.`]);moves.push(`Direct new contributions elsewhere until ${top.h.ticker} drifts under 15%, instead of selling.`);}
  else flags.push(["ok","Position sizing looks contained",`Largest holding is ${top.h.ticker} at ${pct(top.w)}.`]);

  if(hs.length<6){score-=14;flags.push(["high","Thin holding count",`${hs.length} position${hs.length===1?"":"s"} means each one is doing a lot of work.`]);moves.push("Most research points to diminishing benefit past ~20–30 names; a broad dividend ETF gets you there in one line.");}
  else if(hs.length<12){score-=5;flags.push(["med","Room to broaden",`${hs.length} positions. Reasonable, though a single surprise still shows up clearly.`]);}
  else flags.push(["ok","Healthy number of positions",`${hs.length} holdings, top 5 at ${pct(top5)}.`]);

  const bySec={};
  hs.forEach(h=>{bySec[h.sector]=(bySec[h.sector]||0)+value(h);});
  const secs=Object.entries(bySec).map(([k,v])=>({k,w:v/total})).sort((a,b)=>b.w-a.w);
  if(secs[0].w>0.35){score-=18;flags.push(["high","Sector concentration",`${secs[0].k} is ${pct(secs[0].w)} of holdings. These names tend to fall together.`]);moves.push(`Sectors absent entirely: ${SECTORS.filter(s=>!bySec[s]&&s!=="Other").slice(0,4).join(", ")}.`);}
  else if(secs[0].w>0.25){score-=8;flags.push(["med","Leaning into one sector",`${secs[0].k} at ${pct(secs[0].w)}.`]);}
  else flags.push(["ok","Sector spread is reasonable",`Heaviest sector is ${secs[0].k} at ${pct(secs[0].w)}.`]);
  if(secs.length<4){score-=8;moves.push("Fewer than four sectors represented — correlations run high in a narrow book.");}

  const yields = hs.filter(h=>annualIncome(h)>0).map(h=>({h,y:h.div/h.price}));
  const hot = yields.filter(x=>x.y>0.07);
  if(hot.length){score-=Math.min(14,hot.length*7);flags.push(["med","Unusually high yields present",`${hot.map(x=>`${x.h.ticker} at ${pct(x.y)}`).join(", ")}. A yield well above peers is often the market pricing in a possible cut, not free money.`]);moves.push("For any yield above ~7%, check payout ratio, debt load and the dividend's history of increases before adding more.");}

  if(inc>0){
    const ic = hs.map(h=>({h,s:annualIncome(h)/inc})).sort((a,b)=>b.s-a.s)[0];
    if(ic.s>0.25){score-=10;flags.push(["med","Income depends on one payer",`${ic.h.ticker} generates ${pct(ic.s)} of total dividends. A cut there hits your income line hardest.`]);}
    const {totals}=monthlyMatrix(hs);
    const empty=totals.map((v,i)=>v===0?M[i]:null).filter(Boolean);
    if(empty.length>=3){score-=4;flags.push(["med","Uneven payment calendar",`No dividends land in ${empty.join(", ")}.`]);moves.push("Payment months cluster by cycle. Mixing a Feb/May/Aug/Nov payer or a monthly payer smooths the calendar — a convenience, not a return improvement.");}
  }

  const cash = hs.filter(h=>h.sector==="Bonds / cash").reduce((s,h)=>s+value(h),0)/total;
  if(cash<0.02) moves.push("No bonds or cash line here. If part of this money is needed within ~3 years, that portion is exposed to full equity drawdowns.");

  score=Math.max(5,Math.min(100,Math.round(score)));
  const band = score>=80?"Well spread":score>=62?"Moderately concentrated":score>=42?"Concentrated":"Highly concentrated";
  return {score,band,flags,moves,secs,top5,hhi,inc,total};
}

/* ---------------- projection engine ---------------- */
function project(o){
  const yrs=Math.max(1,Math.min(60,o.years));
  const cf=o.compound||12, every=12/cf;
  let val=o.start, income=o.start*o.yieldPct, contributed=o.start, cash=0, mc=o.monthly;
  const rows=[{y:0,val,contributed,income,cash}];
  const rp=Math.pow(1+o.growth,1/cf)-1, rd=Math.pow(1+o.divGrowth,1/12)-1;
  for(let y=1;y<=yrs;y++){
    for(let m=0;m<12;m++){
      const md=income/12, cy=val>0?income/val:0;
      if((m+1)%every===0) val*=(1+rp);
      income*=(1+rd);
      if(o.reinvest){val+=md;income+=md*cy;} else cash+=md;
      val+=mc;contributed+=mc;income+=mc*cy;
    }
    mc*=(1+o.contribGrowth);
    rows.push({y,val,contributed,income,cash});
  }
  return rows;
}

async function sb(path,{method="GET",body,token,headers={}}={}){
  const res=await fetch(SB_URL+path,{
    method,
    headers:{apikey:SB_KEY,"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{}),...headers},
    body:body!==undefined?JSON.stringify(body):undefined,
  });
  const raw=await res.text();
  let data=null; try{data=raw?JSON.parse(raw):null;}catch(e){data=raw;}
  if(!res.ok){
    const m=data?.msg||data?.message||data?.error_description||data?.error||data?.hint||"Something went wrong";
    throw new Error(String(m));
  }
  return data;
}

  const [linked,setLinked]=useState(null);
  const [saved,setSaved]=useState(false);
  const [err,setErr]=useState("");

  const token=session?.access_token;
  const uid=session?.user?.id;
  const pro=isPro(profile)||preview;

  const keep=async s=>{try{await store.set("db:session",JSON.stringify({refresh_token:s.refresh_token}));}catch(e){}};

  useEffect(()=>{(async()=>{
    try{
      const r=await store.get("db:session");
      const rt=r?.value&&JSON.parse(r.value).refresh_token;
      if(rt){
        const d=await sb("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:{refresh_token:rt}});
        if(d.access_token){setSession(d);keep(d);}
      }
    }catch(e){}
    setBooting(false);
  })();},[]);

  useEffect(()=>{
    if(!token||!uid)return;
    (async()=>{
      setLoaded(false);
      try{
        const [p,rows]=await Promise.all([
          sb("/rest/v1/profiles?select=id,plan,plan_status,current_period_end,snaptrade_connected_at,snaptrade_brokerage&limit=1",{token}),
          sb("/rest/v1/holdings?select=*&order=created_at.asc",{token}),
        ]);
        setProfile(Array.isArray(p)?p[0]||null:null);
        setHs((rows||[]).map(fromDb));
      }catch(e){setErr(e.message);}
      setLoaded(true);
    })();
  },[token,uid]);

  const flash=()=>{setSaved(true);setTimeout(()=>setSaved(false),1500);};

  const save=async h=>{
    setErr("");
    try{
      if(h.id&&hs.some(x=>x.id===h.id)){
        const [row]=await sb(`/rest/v1/holdings?id=eq.${h.id}`,{method:"PATCH",token,body:toDb(h,uid),headers:{Prefer:"return=representation"}});
        setHs(p=>p.map(x=>x.id===h.id?fromDb(row):x));
      }else{
        const [row]=await sb("/rest/v1/holdings",{method:"POST",token,body:toDb(h,uid),headers:{Prefer:"return=representation"}});
        setHs(p=>[...p,fromDb(row)]);
      }
      setSheet(null);setEditing(null);flash();
    }catch(e){
      setErr(/FREE_LIMIT/.test(e.message)?"Free accounts hold up to 15 positions. Upgrade for unlimited.":e.message);
    }
  };

  const del=async id=>{
    try{
      await sb(`/rest/v1/holdings?id=eq.${id}`,{method:"DELETE",token});
      setHs(p=>p.filter(x=>x.id!==id));setSheet(null);setEditing(null);flash();
    }catch(e){setErr(e.message);}
  };

  const bulk=async(rows,label)=>{
    setErr("");
    try{
      const out=await sb("/rest/v1/holdings",{method:"POST",token,body:rows.map(r=>toDb(r,uid)),headers:{Prefer:"return=representation"}});
      setHs(p=>[...p,...out.map(fromDb)]);
      if(label)setLinked(label);
      setSheet(null);flash();

      setErr(/FREE_LIMIT/.test(e.message)?"That would pass the 15-holding free limit. Upgrade, or add fewer.":e.message);

    }
  };

  const signOut=async()=>{

  };

  const [paying,setPaying]=useState(false);

    try{
      const rows=await sb("/rest/v1/profiles?select=id,plan,plan_status,current_period_end,snaptrade_connected_at,snaptrade_brokerage&limit=1",{token});

              Dripbook is a tracking and modelling tool, not an advisor, broker, or data feed.<br/>
              Nothing here is financial advice. Prices and dividend figures are whatever you or your import entered — verify against your brokerage before acting.
              {saved&&<div style={{color:"var(--mint)",marginTop:8,fontFamily:"var(--mono)",fontSize:10,letterSpacing:".1em"}}>SAVED</div>}
            </div>
          </div>
        </div>
      </div>

      <nav className="yl-tabs">
        {tabs.map(([k,l,d])=>(
          <button key={k} className={"yl-tab"+(view===k?" on":"")} onClick={()=>setView(k)}>
            <Ico d={d} size={20}/><span className="yl-tab-l">{l}</span>
          </button>
        ))}
      </nav>

      {sheet==="connect"&&<Connect onClose={()=>setSheet(null)} pro={pro} linked={linked} busy={syncing}
        onConnect={connectBrokerage} onSync={()=>{setSheet(null);syncBrokerage();}}
        onDemo={n=>{bulk(DEMO,n);setView("home");}} onManual={()=>{setEditing(null);setSheet("form");}} onImport={()=>setSheet("import")}/>}
      {sheet==="form"&&<HoldingForm h={editing} onSave={save} onDelete={del} onClose={()=>{setSheet(null);setEditing(null);}}/>}
      {sheet==="import"&&<Import onClose={()=>setSheet(null)} onLoad={rows=>{bulk(rows);setView("hold");}}/>}
      {sheet==="sec"&&<Security onClose={()=>setSheet(null)} count={hs.length} email={session?.user?.email} pro={pro}
        onSignOut={signOut} onBilling={billing} isPro={isPro(profile)}
        onWipe={async()=>{try{await sb(`/rest/v1/holdings?user_id=eq.${uid}`,{method:"DELETE",token});setHs([]);setLinked(null);setSheet(null);}catch(e){setErr(e.message);}}}/>}
    </div>
  );
}

/* ---------------- empty ---------------- */
function Empty({onConnect,onAdd}){
  return (
    <div className="yl-empty">
      <div style={{fontFamily:"var(--display)",fontSize:44,color:"var(--brass)",marginBottom:6}}>$0.00</div>
      <div className="yl-empty-t">No income on the books yet</div>
      <div className="yl-empty-d">Link a brokerage to pull holdings in, or enter your first position by hand. Either way it takes about a minute.</div>
      <div style={{display:"flex",gap:9,justifyContent:"center",flexWrap:"wrap"}}>
        <button className="yl-btn" onClick={onConnect}><Ico d={I.link} size={16}/>Connect a brokerage</button>
        <button className="yl-btn ghost" onClick={onAdd}><Ico d={I.plus} size={16}/>Add manually</button>
      </div>
    </div>
  );
}

/* ---------------- overview ---------------- */
function Overview({hs,s,onAdd,go}){
  const {rows,totals}=useMemo(()=>monthlyMatrix(hs),[hs]);
  const [pick,setPick]=useState(new Date().getMonth());
  const max=Math.max(...totals,1);
  const now=new Date().getMonth();
  const next=useMemo(()=>{
    const out=[];
    for(let i=0;i<4;i++){const m=(now+i)%12;
      rows.forEach(r=>{if(r.months[m]>0)out.push({t:r.h.ticker,m,amt:r.months[m],c:r.color,day:r.h.day||15,off:i});});}
    return out.sort((a,b)=>a.off-b.off||a.day-b.day).slice(0,5);
  },[rows,now]);

  return (
    <>
      <h1 className="yl-h1">Your income, month by month</h1>
      <p className="yl-sub">Every bar is a month of dividends, stacked by the position that pays it. Tap one to see who's paying.</p>

      <div className="yl-ledger">
        <div className="yl-ledger-lab">Forward annual income</div>
        <div className="yl-big">{usd(s.inc,2)}<small> /yr</small></div>
        <div style={{fontFamily:"var(--mono)",fontSize:12.5,color:"var(--muted)"}}>≈ {usd(s.inc/12,2)} a month · {usd(s.inc/52,2)} a week</div>
        <div className="yl-ledger-row">
          <div><div className="yl-stat-k">Portfolio</div><div className="yl-stat-v">{usd(s.total)}</div></div>
          <div><div className="yl-stat-k">Yield</div><div className="yl-stat-v" style={{color:"var(--brass)"}}>{pct(s.yieldNow,2)}</div></div>
          <div><div className="yl-stat-k">Yield on cost</div><div className="yl-stat-v" style={{color:"var(--mint)"}}>{pct(s.yoc,2)}</div></div>
          <div><div className="yl-stat-k">Unrealized</div><div className="yl-stat-v" style={{color:s.gain>=0?"var(--mint)":"var(--flag)"}}>{s.gain>=0?"+":""}{usd(s.gain)}</div></div>
        </div>
      </div>

      <div style={{height:22}}/>
      <div className="yl-eyebrow">The 12-month calendar</div>
      <div className="yl-panel">
        <div className="yl-cal">
          {totals.map((t,m)=>(
            <button key={m} className={"yl-cal-col"+(pick===m?" on":"")} onClick={()=>setPick(m)} aria-label={M[m]}>
              <div className="yl-cal-stack" style={{height:`${Math.max(3,(t/max)*100)}%`}}>
                {rows.filter(r=>r.months[m]>0).map((r,i)=>(
                  <div key={i} className="yl-cal-seg" style={{background:r.color,height:`${(r.months[m]/t)*100}%`}}/>
                ))}
              </div>
              <div className="yl-cal-m">{M[m][0]}</div>
            </button>
          ))}
        </div>
        <div className="yl-detail">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:6}}>
            <div style={{fontFamily:"var(--display)",fontSize:18,fontWeight:700}}>{M[pick]}</div>
            <div className="yl-num" style={{fontSize:17,color:"var(--brass)"}}>{usd(totals[pick],2)}</div>
          </div>
          {totals[pick]===0
            ? <div style={{fontSize:12.5,color:"var(--dim)",paddingTop:4}}>Nothing lands in {M[pick]}. Payment cycles cluster — see Risk for how to even it out.</div>
            : rows.filter(r=>r.months[pick]>0).sort((a,b)=>b.months[pick]-a.months[pick]).map((r,i)=>(
              <div key={i} className="yl-detail-row">
                <span className="yl-sw" style={{background:r.color}}/>
                <span className="yl-tick">{r.h.ticker}</span>
                <span style={{color:"var(--dim)",fontSize:11.5}}>{r.h.shares} sh</span>
                <span className="yl-right yl-num">{usd(r.months[pick],2)}</span>
              </div>
            ))}
        </div>
      </div>

      <div style={{height:22}}/>
      <div className="yl-eyebrow">Coming up</div>
      <div className="yl-panel" style={{padding:"6px 16px"}}>
        {next.map((p,i)=>(
          <div key={i} className="yl-detail-row" style={{borderBottom:i<next.length-1?"1px solid var(--line-soft)":"none",padding:"12px 0"}}>
            <span className="yl-sw" style={{background:p.c}}/>
            <div>
              <div className="yl-tick">{p.t}</div>
              <div className="yl-name">est. {M[p.m]} {p.day}</div>
            </div>
            <span className="yl-right yl-num" style={{fontSize:14}}>{usd(p.amt,2)}</span>
          </div>
        ))}
        {!next.length&&<div style={{padding:"14px 0",fontSize:12.5,color:"var(--dim)"}}>No payments scheduled in the next four months.</div>}
      </div>
      <div style={{height:10}}/>
      <div className="yl-note">Payment dates are estimates from each holding's frequency and cycle, not confirmed ex-dividend or pay dates. Set the exact day on any holding to sharpen them.</div>

      <div style={{height:20,}}/>
      <div style={{display:"flex",gap:9}}>
        <button className="yl-btn ghost" style={{flex:1}} onClick={onAdd}><Ico d={I.plus} size={16}/>Add holding</button>
        <button className="yl-btn ghost" style={{flex:1}} onClick={()=>go("grow")}><Ico d={I.up} size={16}/>Project forward</button>
      </div>
    </>
  );
}

/* ---------------- holdings ---------------- */
function Holdings({hs,s,onPick,onAdd}){
  const [sort,setSort]=useState("value");
  const sorted=[...hs].sort((a,b)=>({
    value:value(b)-value(a),
    income:annualIncome(b)-annualIncome(a),
    yield:(b.div/b.price)-(a.div/a.price),
    az:a.ticker.localeCompare(b.ticker),
  })[sort]);

  return (
    <>
      <h1 className="yl-h1">Holdings</h1>
      <p className="yl-sub">{hs.length} positions · {usd(s.total)} at your entered prices. Tap any row to edit shares, cost, or payment schedule.</p>
      <div className="yl-seg" style={{marginBottom:14}}>
        {[["value","Value"],["income","Income"],["yield","Yield"],["az","A–Z"]].map(([k,l])=>(
          <button key={k} className={sort===k?"on":""} onClick={()=>setSort(k)}>{l}</button>
        ))}
      </div>
      {sorted.map(h=>{
        const v=value(h), y=h.price?h.div/h.price:0, g=(h.price-h.cost)*h.shares;
        return (
          <button key={h.id} className="yl-row" onClick={()=>onPick(h)}>
            <div style={{minWidth:0}}>
              <div className="yl-tick">{h.ticker}</div>
              <div className="yl-name">{h.name||h.sector}</div>
            </div>
            <div style={{marginLeft:"auto",textAlign:"right"}}>
              <div className="yl-num" style={{fontSize:14}}>{usd(v)}</div>
              <div className="yl-num" style={{fontSize:11,color:g>=0?"var(--mint)":"var(--flag)"}}>{g>=0?"+":""}{usd(g)}</div>
            </div>
            <div style={{textAlign:"right",width:76,flex:"none"}}>
              <div className="yl-num" style={{fontSize:13,color:"var(--brass)"}}>{usd(annualIncome(h))}</div>
              <div className="yl-num" style={{fontSize:11,color:"var(--dim)"}}>{pct(y,2)} · {h.freq}</div>
            </div>
          </button>
        );
      })}
      <button className="yl-btn wide ghost" style={{marginTop:10}} onClick={onAdd}><Ico d={I.plus} size={16}/>Add holding</button>
    </>
  );
}

/* ---------------- income ---------------- */
function Income({hs,s}){
  const [per,setPer]=useState("m");
  const {rows,totals}=useMemo(()=>monthlyMatrix(hs),[hs]);
  const q=[0,1,2,3].map(i=>totals.slice(i*3,i*3+3).reduce((a,b)=>a+b,0));
  const data = per==="m"?totals.map((v,i)=>({l:M[i],v})) : per==="q"?q.map((v,i)=>({l:"Q"+(i+1),v})) : [{l:"Year",v:s.inc}];
  const max=Math.max(...data.map(d=>d.v),1);
  const payers=[...hs].filter(h=>annualIncome(h)>0).sort((a,b)=>annualIncome(b)-annualIncome(a));

  return (
    <>
      <h1 className="yl-h1">Income</h1>
      <p className="yl-sub">Forward-looking: what today's holdings pay at today's rates, before any increases, cuts, or taxes.</p>
      <div className="yl-seg" style={{marginBottom:16}}>
        {[["m","Monthly"],["q","Quarterly"],["y","Annual"]].map(([k,l])=>(
          <button key={k} className={per===k?"on":""} onClick={()=>setPer(k)}>{l}</button>
        ))}
      </div>

      <div className="yl-panel">
        {data.map((d,i)=>(
          <div key={i} className="yl-bar-row">
            <div className="yl-bar-top">
              <span style={{fontFamily:"var(--mono)",fontSize:11.5,color:"var(--muted)",letterSpacing:".06em"}}>{d.l}</span>
              <span className="yl-num" style={{fontSize:13}}>{usd(d.v,2)}</span>
            </div>
            <div className="yl-bar-track"><div className="yl-bar-fill" style={{width:`${(d.v/max)*100}%`,background:d.v?"var(--brass)":"transparent"}}/></div>
          </div>
        ))}
        <div style={{display:"flex",justifyContent:"space-between",marginTop:14,paddingTop:13,borderTop:"1px solid var(--line)",fontSize:12.5}}>
          <span style={{color:"var(--muted)"}}>{per==="m"?"Best / leanest month":per==="q"?"Best quarter":"Average month"}</span>
          <span className="yl-num">{per==="y"?usd(s.inc/12,2):`${usd(Math.max(...data.map(d=>d.v)),0)} / ${usd(Math.min(...data.map(d=>d.v)),0)}`}</span>
        </div>
      </div>

      <div style={{height:22}}/>
      <div className="yl-eyebrow">Who pays what</div>
      <div className="yl-panel">
        {payers.map((h,i)=>{
          const a=annualIncome(h), share=s.inc?a/s.inc:0;
          return (
            <div key={h.id} className="yl-bar-row">
              <div className="yl-bar-top">
                <span><span className="yl-tick">{h.ticker}</span> <span style={{color:"var(--dim)",fontSize:11}}>{FREQ[h.freq].l} · {usd(perPay(h),2)}/pay</span></span>
                <span className="yl-num">{usd(a)} <span style={{color:"var(--dim)"}}>{pct(share,0)}</span></span>
              </div>
              <div className="yl-bar-track"><div className="yl-bar-fill" style={{width:`${share*100}%`,background:PALETTE[hs.indexOf(h)%PALETTE.length]}}/></div>
            </div>
          );
        })}
        {!payers.length&&<div style={{fontSize:12.5,color:"var(--dim)"}}>None of your holdings are set to pay a dividend.</div>}
      </div>

      <div style={{height:14}}/>
      <div className="yl-note"><b>Taxes aren't modelled.</b> Qualified dividends, REIT distributions like O, and covered-call fund income such as JEPI are all taxed differently, and account type changes the answer again. Treat these as pre-tax figures.</div>
    </>
  );
}

/* ---------------- grow (compound) ---------------- */
function Grow({hs,s}){
  const [mode,setMode]=useState(hs.length?"port":"fresh");
  useEffect(()=>{if(!hs.length&&mode==="port")setMode("fresh");},[hs.length,mode]);
  const [p,setP]=useState({monthly:500,years:20,growth:6,divGrowth:5,reinvest:true,contribGrowth:2});
  const [f,setF]=useState({start:10000,monthly:500,years:25,rate:7,compound:12,contribGrowth:0});
  const set=(o,k,v)=>o===0?setP(x=>({...x,[k]:v})):setF(x=>({...x,[k]:v}));

  const rows=useMemo(()=>mode==="port"
    ? project({start:s.total,monthly:num(p.monthly),years:num(p.years,1),growth:num(p.growth)/100,yieldPct:s.yieldNow,divGrowth:num(p.divGrowth)/100,reinvest:p.reinvest,contribGrowth:num(p.contribGrowth)/100,compound:12})
    : project({start:num(f.start),monthly:num(f.monthly),years:num(f.years,1),growth:num(f.rate)/100,yieldPct:0,divGrowth:0,reinvest:false,contribGrowth:num(f.contribGrowth)/100,compound:num(f.compound,12)})
  ,[mode,p,f,s]);

  const end=rows[rows.length-1];
  const interest=end.val-end.contributed;

  return (
    <>
      <h1 className="yl-h1">Project it forward</h1>
      <p className="yl-sub">A model, not a forecast. Markets don't deliver the same return every year, and this assumes they do.</p>

      <div className="yl-seg" style={{marginBottom:18}}>
        <button className={mode==="port"?"on":""} onClick={()=>setMode("port")} disabled={!hs.length}>From my portfolio</button>
        <button className={mode==="fresh"?"on":""} onClick={()=>setMode("fresh")}>Blank calculator</button>
      </div>

      <ProjChart rows={rows}/>

      <div className="yl-grid g3" style={{margin:"16px 0 22px"}}>
        <Stat k={`Value in ${end.y} years`} v={usd(end.val)} c="var(--text)"/>
        <Stat k="You put in" v={usd(end.contributed)} c="var(--muted)"/>
        <Stat k={mode==="port"?"Market + dividends":"Interest earned"} v={usd(interest)} c="var(--mint)"/>
      </div>

      {mode==="port"?(
        <>
          <div className="yl-ledger" style={{marginBottom:20}}>
            <div className="yl-ledger-lab">Dividend income in year {end.y}</div>
            <div className="yl-big" style={{fontSize:32}}>{usd(end.income)}<small> /yr</small></div>
            <div style={{fontFamily:"var(--mono)",fontSize:12.5,color:"var(--muted)"}}>{usd(end.income/12)} a month · {pct(s.total?end.income/s.total:0,1)} yield on today's balance</div>
          </div>

          <div className="yl-eyebrow">Assumptions</div>
          <div className="yl-panel">
            <div className="yl-note" style={{marginBottom:16}}>Starting from <b>{usd(s.total)}</b> at a <b>{pct(s.yieldNow,2)}</b> yield — pulled from your holdings.</div>
            <Dial lab="Monthly contribution" v={p.monthly} set={v=>set(0,"monthly",v)} min={0} max={10000} step={50} money hint="type any amount"/>
            <Dial lab="Annual price growth" v={p.growth} set={v=>set(0,"growth",v)} min={-5} max={20} step={0.25} unit="%"/>
            <Dial lab="Annual dividend growth" v={p.divGrowth} set={v=>set(0,"divGrowth",v)} min={0} max={20} step={0.25} unit="%"/>
            <Dial lab="Contribution increase each year" v={p.contribGrowth} set={v=>set(0,"contribGrowth",v)} min={0} max={15} step={0.5} unit="%"/>
            <Dial lab="Years" v={p.years} set={v=>set(0,"years",v)} min={1} max={60} step={1} unit="yr"/>
            <label style={{display:"flex",alignItems:"center",gap:10,marginTop:14,cursor:"pointer",fontSize:14}}>
              <input type="checkbox" checked={p.reinvest} onChange={e=>set(0,"reinvest",e.target.checked)} style={{width:17,height:17,accentColor:"#5FCFA0"}}/>
              Reinvest dividends (DRIP)
            </label>
            <div style={{fontSize:11.5,color:"var(--dim)",marginTop:7,lineHeight:1.5}}>
              {p.reinvest?"Payments buy more shares, which pay more dividends. That loop is the whole point.":`Payments accumulate as cash: ${usd(end.cash)} over ${end.y} years, uninvested.`}
            </div>
            <div style={{marginTop:14,paddingTop:13,borderTop:"1px solid var(--line)",fontSize:12,color:"var(--muted)",lineHeight:1.6}}>
              Implied total return: <span className="yl-num" style={{color:"var(--text)"}}>{(num(p.growth)+s.yieldNow*100).toFixed(1)}%</span> — price growth plus current yield. Historical US large-cap has averaged roughly 10% nominal over long stretches, with decade-long spans well above and below that.
            </div>
          </div>
        </>
      ):(
        <>
          <div className="yl-eyebrow">Inputs</div>
          <div className="yl-panel">
            <Dial lab="Starting amount" v={f.start} set={v=>set(1,"start",v)} min={0} max={250000} step={500} money hint="type any amount"/>
            <Dial lab="Monthly addition" v={f.monthly} set={v=>set(1,"monthly",v)} min={0} max={10000} step={50} money hint="type any amount"/>
            <Dial lab="Annual return" v={f.rate} set={v=>set(1,"rate",v)} min={0} max={25} step={0.25} unit="%"/>
            <Dial lab="Years" v={f.years} set={v=>set(1,"years",v)} min={1} max={60} step={1} unit="yr"/>
            <Dial lab="Contribution increase each year" v={f.contribGrowth} set={v=>set(1,"contribGrowth",v)} min={0} max={15} step={0.5} unit="%"/>
            <div className="yl-field" style={{marginTop:14}}>
              <label className="yl-lab">Compounding</label>
              <select className="yl-in" value={f.compound} onChange={e=>set(1,"compound",+e.target.value)}>
                <option value={12}>Monthly</option><option value={4}>Quarterly</option><option value={1}>Annually</option>
              </select>
            </div>
            <div style={{fontSize:12,color:"var(--muted)",lineHeight:1.6,paddingTop:12,borderTop:"1px solid var(--line)"}}>
              {usd(num(f.start))} plus {usd(num(f.monthly))}/mo at {f.rate}% for {f.years} years. Growth is {pct(interest/Math.max(end.contributed,1),0)} of what you contributed.
            </div>
          </div>
        </>
      )}

      <div style={{height:22}}/>
      <div className="yl-eyebrow">Year by year</div>
      <div className="yl-panel yl-scrollx">
        <table className="yl-tbl">
          <thead><tr><th>Yr</th><th>Balance</th><th>Contributed</th><th>Growth</th>{mode==="port"&&<th>Income</th>}</tr></thead>
          <tbody>
            {rows.filter(r=>r.y>0&&(rows.length<=16||r.y%Math.ceil(rows.length/14)===0||r.y===end.y)).map(r=>(
              <tr key={r.y}>
                <td style={{color:"var(--dim)"}}>{r.y}</td>
                <td>{usd(r.val)}</td>
                <td style={{color:"var(--muted)"}}>{usd(r.contributed)}</td>
                <td style={{color:"var(--mint)"}}>{usd(r.val-r.contributed)}</td>
                {mode==="port"&&<td style={{color:"var(--brass)"}}>{usd(r.income)}</td>}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div style={{height:14}}/>
      <div className="yl-note"><b>What this leaves out:</b> taxes, fees, inflation, dividend cuts, and the fact that real returns arrive unevenly. A 7% average delivered as −18%, +31%, +4% ends in a different place than 7% every year once you're withdrawing. Use it to compare choices, not to plan on a number.</div>
    </>
  );
}

function Stat({k,v,c}){
  return <div className="yl-panel" style={{padding:"14px 15px"}}>
    <div className="yl-stat-k">{k}</div>
    <div className="yl-num" style={{fontSize:19,color:c,letterSpacing:"-.03em"}}>{v}</div>
  </div>;
}
function Dial({lab,v,set,min,max,step,unit,money,hint}){
  const n=num(v);
  const clamp=Math.min(Math.max(n,min),max);
  const over=n>max, under=n<min;
  const tick=x=>money?(Math.abs(x)>=1000?"$"+(x/1000)+"k":"$"+x):x+(unit||"");
  return (
    <div style={{marginBottom:17}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:12}}>
        <label className="yl-lab" style={{marginBottom:0}}>{lab}</label>
        <div className="yl-stepper">
          {money&&<span className="yl-affix">$</span>}
          <input className="yl-mini" type="number" value={v} step={step} inputMode="decimal"
            onChange={e=>set(e.target.value)} onBlur={e=>e.target.value===""&&set(min)} aria-label={lab}/>
          {unit&&<span className="yl-affix">{unit}</span>}
        </div>
      </div>
      <input className="yl-slide" type="range" min={min} max={max} step={step} value={clamp}
        onChange={e=>set(+e.target.value)} aria-label={lab+" slider"}/>
      <div className="yl-scale">
        <span>{tick(min)}</span>
        {(over||under)&&<span style={{color:"var(--brass)"}}>typed value in use</span>}
        {!over&&!under&&hint&&<span>{hint}</span>}
        <span>{tick(max)}+</span>
      </div>
    </div>
  );
}

function ProjChart({rows}){
  const W=600,H=210,P=4;
  const max=Math.max(...rows.map(r=>r.val))||1;
  const x=i=>P+(i/(rows.length-1))*(W-P*2);
  const y=v=>H-P-(v/max)*(H-P*2-16);
  const line=k=>rows.map((r,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(r[k]).toFixed(1)}`).join(" ");
  return (
    <div className="yl-panel" style={{padding:"16px 14px 12px"}}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",display:"block"}} preserveAspectRatio="none">
        <defs>
          <linearGradient id="ylg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#5FCFA0" stopOpacity=".34"/><stop offset="100%" stopColor="#5FCFA0" stopOpacity="0"/>
          </linearGradient>
        </defs>
        <path d={`${line("val")} L${x(rows.length-1)},${H-P} L${x(0)},${H-P} Z`} fill="url(#ylg)"/>
        <path d={`${line("contributed")} L${x(rows.length-1)},${H-P} L${x(0)},${H-P} Z`} fill="#D9A441" fillOpacity=".14"/>
        <path d={line("contributed")} fill="none" stroke="#D9A441" strokeWidth="1.6" strokeDasharray="4 3" vectorEffect="non-scaling-stroke"/>
        <path d={line("val")} fill="none" stroke="#5FCFA0" strokeWidth="2.2" vectorEffect="non-scaling-stroke"/>
      </svg>
      <div style={{display:"flex",gap:16,marginTop:10,fontFamily:"var(--mono)",fontSize:10,letterSpacing:".07em",color:"var(--muted)",textTransform:"uppercase"}}>
        <span style={{display:"flex",alignItems:"center",gap:6}}><span style={{width:12,height:2,background:"#5FCFA0"}}/>Balance</span>
        <span style={{display:"flex",alignItems:"center",gap:6}}><span style={{width:12,height:2,background:"#D9A441"}}/>Your money in</span>
        <span style={{marginLeft:"auto"}}>Yr 0 → {rows.length-1}</span>
      </div>
    </div>
  );
}

/* ---------------- risk ---------------- */
function Risk({hs}){
  const a=useMemo(()=>analyze(hs),[hs]);
  if(!a) return null;
  const col=l=>l==="high"?"var(--flag)":l==="med"?"var(--brass)":"var(--mint)";
  return (
    <>
      <h1 className="yl-h1">Risk check</h1>
      <p className="yl-sub">A structural read on how your money is spread — concentration, sectors, and where your income comes from.</p>

      <div className="yl-note" style={{marginBottom:20,borderLeftColor:"var(--flag)"}}>
        <b>This is not financial advice.</b> No one here knows your age, taxes, debts, income, or what this money is for. These are housekeeping observations about the shape of a portfolio — the kind of tidying-up worth raising with a licensed advisor who knows your full picture.
      </div>

      <div className="yl-panel">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
          <div>
            <div className="yl-stat-k">Diversification read</div>
            <div style={{fontFamily:"var(--display)",fontSize:24,fontWeight:700,letterSpacing:"-.02em"}}>{a.band}</div>
          </div>
          <div className="yl-num" style={{fontSize:34,letterSpacing:"-.04em"}}>{a.score}<span style={{fontSize:15,color:"var(--dim)"}}>/100</span></div>
        </div>
        <div className="yl-gauge"><div className="yl-gauge-p" style={{left:`${a.score}%`}}/></div>
        <div style={{display:"flex",justifyContent:"space-between",fontFamily:"var(--mono)",fontSize:9.5,color:"var(--dim)",letterSpacing:".1em",textTransform:"uppercase"}}>
          <span>Concentrated</span><span>Well spread</span>
        </div>
        <div style={{fontSize:12,color:"var(--muted)",marginTop:14,lineHeight:1.6,paddingTop:13,borderTop:"1px solid var(--line)"}}>
          Scored on position sizing, holding count, sector mix, yield outliers, and income dependence. It says nothing about whether these are good companies or good prices.
        </div>
      </div>

      <div style={{height:22}}/>
      <div className="yl-eyebrow">Sector mix</div>
      <div className="yl-panel">
        {a.secs.map((s,i)=>(
          <div key={s.k} className="yl-bar-row">
            <div className="yl-bar-top"><span>{s.k}</span><span className="yl-num">{pct(s.w,1)}</span></div>
            <div className="yl-bar-track"><div className="yl-bar-fill" style={{width:`${s.w*100}%`,background:s.w>0.35?"var(--flag)":s.w>0.25?"var(--brass)":"var(--mint)"}}/></div>
          </div>
        ))}
      </div>

      <div style={{height:22}}/>
      <div className="yl-eyebrow">What stands out</div>
      <div className="yl-panel">
        {a.flags.map((f,i)=>(
          <div key={i} className="yl-flag">
            <span className="yl-pip" style={{background:col(f[0])}}/>
            <div><div className="yl-flag-t">{f[1]}</div><div className="yl-flag-d">{f[2]}</div></div>
          </div>
        ))}
      </div>

      {a.moves.length>0&&<>
        <div style={{height:22}}/>
        <div className="yl-eyebrow">Ways to tidy it up</div>
        <div className="yl-panel">
          {a.moves.map((m,i)=>(
            <div key={i} style={{display:"flex",gap:11,padding:"11px 0",borderBottom:i<a.moves.length-1?"1px solid var(--line-soft)":"none"}}>
              <span className="yl-num" style={{color:"var(--brass)",fontSize:11,paddingTop:2}}>{String(i+1).padStart(2,"0")}</span>
              <div className="yl-flag-d" style={{color:"var(--text)"}}>{m}</div>
            </div>
          ))}
        </div>
        <div style={{height:12}}/>
        <div className="yl-note">These are general diversification principles applied to the numbers you entered — not recommendations to buy or sell anything. Selling has tax consequences this app can't see.</div>
      </>}
    </>
  );
}

/* ---------------- connect ---------------- */
function Connect({onClose,onDemo,onManual,onImport,onConnect,onSync,pro,linked,busy}){
  const [step,setStep]=useState(0);
  const [pickd,setPickd]=useState(null);
  const brokers=["Fidelity","Charles Schwab","Robinhood","E*TRADE","Vanguard","Interactive Brokers","Merrill Edge","Webull","M1 Finance","Public","Wealthsimple","Questrade"];

  if(step===1) return (
    <Sheet onClose={onClose} title={`Connect ${pickd}`}>
      <div className="yl-note" style={{borderLeftColor:"var(--flag)",marginBottom:18}}>
        <b>Demo mode.</b> This build has no live brokerage link. Continuing loads a sample portfolio so you can see how the app behaves with real-shaped data. Nothing connects to {pickd} and no credentials are requested.
      </div>
      <div className="yl-eyebrow">What a real connection would do</div>
      <div style={{fontSize:13,lineHeight:1.65,color:"var(--muted)",marginBottom:18}}>
        <p style={{margin:"0 0 10px"}}><b style={{color:"var(--text)"}}>Read-only access.</b> Positions, cost basis, and transaction history. No trading permission, no withdrawals.</p>
        <p style={{margin:"0 0 10px"}}><b style={{color:"var(--text)"}}>You log in at {pickd}, not here.</b> Credentials go to the broker's own page. The app receives a revocable token instead of your password.</p>
        <p style={{margin:0}}><b style={{color:"var(--text)"}}>Revoke anytime</b> from either side, which kills the token immediately.</p>
      </div>
      <button className="yl-btn wide" onClick={()=>onDemo(pickd)}>Load sample portfolio</button>
      <button className="yl-btn wide ghost" style={{marginTop:9}} onClick={()=>setStep(0)}>Back</button>
    </Sheet>
  );

  return (
    <Sheet onClose={onClose} title="Connect an account">
      <p style={{fontSize:13,color:"var(--muted)",lineHeight:1.6,margin:"0 0 18px"}}>Pick where your investments live. Access is read-only — this app can see holdings, never move money.</p>
      {pro ? (
        <>
          <button className="yl-btn wide" onClick={()=>onConnect()} disabled={busy} style={{opacity:busy?.5:1}}>
            {busy?"Opening…":"Link a brokerage account"}
          </button>
          <div style={{fontSize:11.5,color:"var(--dim)",textAlign:"center",margin:"10px 0 18px",lineHeight:1.55}}>
            You'll sign in at your broker, not here. Read-only access to positions and cost basis — no trading permission is requested, and you can revoke it from either side at any time.
          </div>
          {linked&&<button className="yl-btn wide ghost" style={{marginBottom:18}} onClick={onSync} disabled={busy}>
            {busy?"Syncing…":`Re-sync ${linked}`}
          </button>}
          <div className="yl-eyebrow">Or enter it yourself</div>
        </>
      ) : (
        <div className="yl-note" style={{marginBottom:18}}>
          <b>Linking a brokerage is part of Pro.</b> Free accounts can add up to 15 holdings by hand or paste a CSV export — everything else in the app works the same.
        </div>
      )}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:20}} hidden={pro}>
        {brokers.map(b=>(
          <button key={b} onClick={()=>{setPickd(b);setStep(1);}} style={{
            border:"1px solid var(--line)",borderRadius:10,padding:"13px 12px",fontSize:13,fontWeight:500,
            background:"var(--ink)",textAlign:"left",transition:".15s"
          }}>{b}</button>
        ))}
      </div>
      <div className="yl-eyebrow">Or bring your own data</div>
      <button className="yl-btn wide ghost" onClick={onImport}>Paste a CSV export</button>
      <button className="yl-btn wide ghost" style={{marginTop:9}} onClick={onManual}>Enter a holding by hand</button>
    </Sheet>
  );
}

/* ---------------- import ---------------- */
function Import({onClose,onLoad}){
  const [txt,setTxt]=useState("");
  const [err,setErr]=useState("");
  const sample="ticker,name,shares,cost,price,annual_dividend,frequency,sector\nPEP,PepsiCo,45,168,142,5.42,Q,Consumer staples\nSTAG,Stag Industrial,200,32,36,1.49,M,Real estate";

  const parse=()=>{
    const lines=txt.trim().split(/\r?\n/).filter(Boolean);
    if(lines.length<2) return setErr("Add a header row plus at least one holding.");
    const head=lines[0].toLowerCase().split(",").map(s=>s.trim());
    const at=(...names)=>{for(const n of names){const i=head.findIndex(h=>h.includes(n));if(i>=0)return i;}return -1;};
    const ix={t:at("ticker","symbol"),n:at("name","desc"),s:at("shares","qty","quantity"),c:at("cost","basis"),p:at("price","last"),d:at("dividend","div"),f:at("freq"),sec:at("sector")};
    if(ix.t<0||ix.s<0) return setErr("Couldn't find a ticker and shares column. Rename the headers or use the template.");
    const out=[];
    lines.slice(1).forEach((l,i)=>{
      const c=l.split(",").map(s=>s.trim().replace(/^["']|["']$/g,"").replace(/[$,]/g,""));
      if(!c[ix.t])return;
      const f=(c[ix.f]||"Q").toUpperCase()[0];
      out.push({id:"i"+Date.now()+i,ticker:c[ix.t].toUpperCase(),name:ix.n>=0?c[ix.n]:"",shares:num(c[ix.s]),
        cost:ix.c>=0?num(c[ix.c]):num(c[ix.p]),price:ix.p>=0?num(c[ix.p]):0,div:ix.d>=0?num(c[ix.d]):0,
        freq:FREQ[f]?f:"Q",sector:ix.sec>=0&&SECTORS.includes(c[ix.sec])?c[ix.sec]:"Other",anchor:2,day:15});
    });
    if(!out.length) return setErr("No rows parsed. Check for stray blank lines.");
    onLoad(out);
  };

  return (
    <Sheet onClose={onClose} title="Paste a CSV">
      <p style={{fontSize:13,color:"var(--muted)",lineHeight:1.6,margin:"0 0 14px"}}>Export positions from your broker and paste them below. Column order doesn't matter — headers are matched by name.</p>
      <textarea className="yl-in" rows={7} value={txt} onChange={e=>{setTxt(e.target.value);setErr("");}} placeholder={sample} style={{fontSize:12,lineHeight:1.5,resize:"vertical"}}/>
      {err&&<div style={{color:"var(--flag)",fontSize:12.5,marginTop:9}}>{err}</div>}
      <button className="yl-btn wide" style={{marginTop:14}} onClick={parse}>Import holdings</button>
      <button className="yl-btn wide ghost" style={{marginTop:9}} onClick={()=>setTxt(sample)}>Fill in the template</button>
    </Sheet>
  );
}

/* ---------------- holding form ---------------- */
function HoldingForm({h,onSave,onDelete,onClose}){
  const [d,setD]=useState(h||{ticker:"",name:"",shares:"",cost:"",price:"",div:"",freq:"Q",sector:"Other",anchor:2,day:15});
  const set=(k,v)=>setD(p=>({...p,[k]:v}));
  const ok=d.ticker.trim()&&num(d.shares)>0;
  const y=num(d.price)?num(d.div)/num(d.price):0;
  const months=payMonths({...d,anchor:num(d.anchor)});

  return (
    <Sheet onClose={onClose} title={h?`Edit ${h.ticker}`:"Add a holding"}>
      <div className="yl-grid g2">
        <div className="yl-field"><label className="yl-lab">Ticker</label>
          <input className="yl-in" value={d.ticker} onChange={e=>set("ticker",e.target.value.toUpperCase())} placeholder="KO" maxLength={8}/></div>
        <div className="yl-field"><label className="yl-lab">Shares</label>
          <input className="yl-in" type="number" value={d.shares} onChange={e=>set("shares",e.target.value)} placeholder="100" inputMode="decimal"/></div>
      </div>
      <div className="yl-field"><label className="yl-lab">Company name</label>
        <input className="yl-in txt" value={d.name} onChange={e=>set("name",e.target.value)} placeholder="Coca-Cola"/></div>
      <div className="yl-grid g2">
        <div className="yl-field"><label className="yl-lab">Cost per share</label>
          <input className="yl-in" type="number" value={d.cost} onChange={e=>set("cost",e.target.value)} placeholder="52.00" inputMode="decimal"/></div>
        <div className="yl-field"><label className="yl-lab">Price now</label>
          <input className="yl-in" type="number" value={d.price} onChange={e=>set("price",e.target.value)} placeholder="70.00" inputMode="decimal"/></div>
      </div>
      <div className="yl-grid g2">
        <div className="yl-field"><label className="yl-lab">Dividend / share / yr</label>
          <input className="yl-in" type="number" value={d.div} onChange={e=>set("div",e.target.value)} placeholder="2.04" inputMode="decimal"/></div>
        <div className="yl-field"><label className="yl-lab">Pays</label>
          <select className="yl-in" value={d.freq} onChange={e=>set("freq",e.target.value)}>
            {Object.entries(FREQ).map(([k,v])=><option key={k} value={k}>{v.l}</option>)}
          </select></div>
      </div>
      {FREQ[d.freq].n>0&&FREQ[d.freq].n<12&&(
        <div className="yl-field"><label className="yl-lab">First payment month</label>
          <select className="yl-in txt" value={d.anchor} onChange={e=>set("anchor",+e.target.value)}>
            {M.map((m,i)=><option key={i} value={i}>{m}</option>)}
          </select>
          <div style={{fontSize:11.5,color:"var(--dim)",marginTop:7,fontFamily:"var(--mono)"}}>
            Pays: {months.map(m=>M[m]).join(" · ")}
          </div>
        </div>
      )}
      <div className="yl-field"><label className="yl-lab">Sector</label>
        <select className="yl-in txt" value={d.sector} onChange={e=>set("sector",e.target.value)}>
          {SECTORS.map(s=><option key={s} value={s}>{s}</option>)}
        </select></div>

      {ok&&num(d.price)>0&&(
        <div className="yl-note" style={{marginBottom:16}}>
          {usd(num(d.shares)*num(d.price))} position · {pct(y,2)} yield · <b>{usd(num(d.shares)*num(d.div))}/yr</b>
          {FREQ[d.freq].n>0&&<> ({usd(num(d.shares)*num(d.div)/FREQ[d.freq].n,2)} per payment)</>}
          {y>0.08&&<div style={{color:"var(--brass)",marginTop:6}}>A yield that high is worth a second look — it often means the market expects a cut.</div>}
        </div>
      )}
      <button className="yl-btn wide" disabled={!ok} style={{opacity:ok?1:.4}} onClick={()=>ok&&onSave({...d,shares:num(d.shares),cost:num(d.cost),price:num(d.price),div:num(d.div),anchor:num(d.anchor)})}>
        {h?"Save changes":"Add holding"}
      </button>
      {h&&<button className="yl-btn wide ghost" style={{marginTop:9,color:"var(--flag)",borderColor:"rgba(224,121,107,.3)"}} onClick={()=>onDelete(h.id)}>Remove {h.ticker}</button>}
    </Sheet>
  );
}

/* ---------------- security ---------------- */
function Security({onClose,onWipe,onSignOut,onBilling,isPro,count,email,pro}){
  const [c,setC]=useState(false);
  return (
    <Sheet onClose={onClose} title="Your data">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,marginBottom:16,paddingBottom:14,borderBottom:"1px solid var(--line)"}}>
        <div style={{minWidth:0}}>
          <div style={{fontSize:13.5,overflow:"hidden",textOverflow:"ellipsis"}}>{email}</div>
          <div className="yl-tag" style={{marginTop:3}}>{pro?"Pro plan":`Free · ${count}/15 holdings`}</div>
        </div>
        <button className="yl-btn sm ghost" onClick={onSignOut}>Sign out</button>
      </div>
      {isPro&&<button className="yl-btn wide ghost" style={{marginBottom:16}} onClick={onBilling}>Manage billing or cancel</button>}
      <div className="yl-note" style={{marginBottom:18}}>
        <b>What's actually true right now:</b> your {count} holding{count===1?"":"s"} live in a Postgres database with row-level security, meaning the database itself refuses to return your rows to anyone else's session. Nothing is sent to a broker, an exchange, or an ad network. There is no live market feed — every price and dividend figure came from you or the sample data.
      </div>
      <div className="yl-eyebrow">How a production build should handle it</div>
      <div style={{fontSize:13,lineHeight:1.7,color:"var(--muted)"}}>
        <p style={{margin:"0 0 11px"}}><b style={{color:"var(--text)"}}>Never hold credentials.</b> Brokerage links go through an aggregator's OAuth flow. You authenticate on the broker's domain; the app stores a revocable read-only token.</p>
        <p style={{margin:"0 0 11px"}}><b style={{color:"var(--text)"}}>Read-only scope, enforced server-side.</b> No trading or transfer permissions requested, ever.</p>
        <p style={{margin:"0 0 11px"}}><b style={{color:"var(--text)"}}>Encrypted at rest and in transit.</b> Tokens in a dedicated secrets manager with per-user keys, so a database leak alone yields nothing usable.</p>
        <p style={{margin:"0 0 11px"}}><b style={{color:"var(--text)"}}>No selling order flow or personal data.</b> Subscription revenue, not data brokerage.</p>
        <p style={{margin:"0 0 11px"}}><b style={{color:"var(--text)"}}>Delete means delete.</b> One button wipes holdings, tokens, and derived analytics.</p>
        <p style={{margin:0,color:"var(--dim)",fontSize:12}}>No app can honestly promise it will never be breached. What it can promise is holding as little as possible and making anything stolen useless.</p>
      </div>
      <div style={{height:20}}/>
      {!c
        ? <button className="yl-btn wide ghost" style={{color:"var(--flag)",borderColor:"rgba(224,121,107,.3)"}} onClick={()=>setC(true)}>Erase everything</button>
        : <>
            <div style={{fontSize:13,color:"var(--text)",marginBottom:10,textAlign:"center"}}>Erase all {count} holdings? This can't be undone.</div>
            <button className="yl-btn wide" style={{background:"var(--flag)",color:"#160806"}} onClick={onWipe}>Yes, erase everything</button>
            <button className="yl-btn wide ghost" style={{marginTop:9}} onClick={()=>setC(false)}>Keep my data</button>
          </>}
    </Sheet>
  );
}

/* ---------------- sheet shell ---------------- */
function Sheet({title,children,onClose}){
  return (
    <div className="yl-scrim" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="yl-sheet">
        <div className="yl-sheet-h">
          <div className="yl-sheet-t">{title}</div>
          <button style={{marginLeft:"auto",color:"var(--muted)",padding:4}} onClick={onClose} aria-label="Close"><Ico d={I.x} size={20}/></button>
        </div>
        {children}
      </div>
    </div>
  );
}
